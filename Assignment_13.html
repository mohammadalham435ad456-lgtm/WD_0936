
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Timetable</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 12px;
        }
        th {
            background-color: lightblue;
        }
        .break {
            background-color: lightyellow;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>12-1 PM</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>Mathematics</td>
            <td>Physics</td>
            <td rowspan="5" class="break">Lunch Break</td>
            <td>Programming</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>English</td>
            <td>Mathematics</td>
            <td>Electronics</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td colspan="2">Programming Lab</td>
            <td>Physics</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>Electronics</td>
            <td>English</td>
            <td>Mathematics</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td>Physics</td>
            <td>Programming</td>
            <td>English</td>
        </tr>
    </table>

</body>
</html>
